name: TB Design — publish isolated Cloudflare preview

on:
  push:
    branches:
      - feature/design-portfolio-v1
    paths:
      - 'design/**'
      - '.github/workflows/design-cloudflare-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tb-design-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Publish separate Pages review site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_PROJECT: tb-design-portfolio-2026
      PREVIEW_BRANCH: feature/design-portfolio-v1
    steps:
      - name: Check Cloudflare credentials are configured
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub repository secret CLOUDFLARE_API_TOKEN. Add a Cloudflare token with Pages Edit access in repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID. Add the account ID as an Actions repository variable or secret."
            exit 1
          fi

      - name: Checkout only the review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build independent portfolio
        working-directory: design
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Confirm separate Pages project or create it
        working-directory: design
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}"
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/cf-project.json" --write-out '%{http_code}' --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$endpoint")
          case "$code" in
            404)
              echo "Creating isolated Cloudflare Pages project: ${PREVIEW_PROJECT}"
              npx --yes wrangler@4 pages project create "$PREVIEW_PROJECT" --production-branch "$PREVIEW_BRANCH"
              ;;
            200)
              echo "Review project exists; checking production branch."
              EXPECTED_BRANCH="$PREVIEW_BRANCH" node -e '
                const p = require(process.env.RUNNER_TEMP + "/cf-project.json");
                if (p.result?.production_branch !== process.env.EXPECTED_BRANCH) {
                  console.error("Existing Pages project branch does not match isolated review branch; refusing to overwrite it.");
                  process.exit(1);
                }
                console.log("Existing Pages project matches review branch.");
              '
              ;;
            *)
              echo "::error::Cloudflare Pages lookup returned HTTP ${code}. Check account ID and Pages Edit token permissions."
              exit 1
              ;;
          esac

      - name: Upload review build to Cloudflare Pages
        working-directory: design
        shell: bash
        run: |
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$PREVIEW_PROJECT" \
            --branch "$PREVIEW_BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "TB Design isolated review"

      - name: Report actual Cloudflare preview URL
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PREVIEW_PROJECT}"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "$endpoint" > "$RUNNER_TEMP/cf-project-after.json"
          node <<'NODE'
          const fs = require('fs');
          const project = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cf-project-after.json', 'utf8')).result;
          if (!project?.subdomain) {
            console.error('Cloudflare did not return a Pages subdomain. Inspect the deployment output.');
            process.exit(1);
          }
          const url = 'https://' + project.subdomain;
          const body = '## TB / DESIGN review preview\n\n' +
            '**Preview URL:** ' + url + '\n\n' +
            'Project: ' + project.name + '\n\n' +
            'Branch: ' + project.production_branch + '\n\n' +
            'No custom domain or existing production worker was modified.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, body);
          console.log('Confirmed Pages project URL: ' + url);
          NODE
