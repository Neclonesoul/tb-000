name: TB Design — build and review artifact

on:
  push:
    branches:
      - feature/design-portfolio-v1
    paths:
      - 'design/**'
      - '.github/workflows/design-preview-ci.yml'
  pull_request:
    paths:
      - 'design/**'
      - '.github/workflows/design-preview-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Validate independent Astro site
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: design
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static and accessibility-oriented type checks
        run: npm run check
      - name: Build preview
        run: npm run build
      - name: Publish build artifact for private review
        uses: actions/upload-artifact@v4
        with:
          name: tb-design-static-preview
          path: design/dist
          if-no-files-found: error
          retention-days: 7
      - name: Install browser test runner and Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Review desktop and mobile layouts
        run: node scripts/visual-preview.mjs
      - name: Upload visual review and smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb-design-visual-review
          path: design/preview-artifacts
          if-no-files-found: warn
          retention-days: 7
